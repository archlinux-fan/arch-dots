# ============================================================
# general.toml  –  Behaviour: tags, layouts, focus, input,
#                  overview, system
# ============================================================

[global]

# ── Tags (mango's workspaces) ───────────────────────────────
# Every monitor has its own tags 1-10 (Super+1..9, Super+0 = 10).
tag_num              = 10
view_current_to_back = 0   # 1 = Super+N on the shown tag goes back to the previous one
tag_gather           = 0   # 1 = busy tags are renumbered 1, 2, 3 ... without gaps
tag_carousel         = 0   # 1 = next / previous tag wraps around

# ── Layouts ─────────────────────────────────────────────────
# Each tag starts in fair (tag_rule in windowrules.toml).
# Super+N and a click on the layout in waybar go through these in order;
# comment out the ones you don't want (keep at least two). Right click in waybar
# goes back to fair; a layout not in the list continues with the first one.
circle_layout = [
    "fair",               # grid without empty cells, columns share the screen
    "tile",               # master left, the others stacked right
#    "right_tile",         # master right, the others stacked left
#    "center_tile",        # master in the middle, the others left and right
    "vertical_tile",      # master on top, the others side by side below
#    "scroller",           # windows as columns on a strip wider than the screen (niri)
#    "vertical_scroller",  # the same with rows, scrolls up and down
#    "monocle",            # one window fills the screen, the others as tabs
#    "deck",               # master left, the others as tabs right
#    "vertical_deck",      # master on top, the others as tabs below
#    "grid",               # all windows in an even grid
#    "vertical_grid",      # even grid, filled column by column
#    "vertical_fair",      # fair with rows
]

# Master and stack (tile, vertical_tile)
# 0: a new window joins the stack, the first one stays master (Firefox big, Thunar beside it).
# In every layout it sets the order: 0 = new windows go last, 1 = first (fair keeps equal sizes)
new_is_master         = 0
default_master_factor = 0.6   # master 60 %, stack 40 %; Super+right drag on the border changes it
default_master_count  = 1

# Special tag (Super+S): a tiled tag shown over the current one
special_dim = 0.5

# Scratchpad: hidden windows shown floating on demand
scratchpad_width_ratio  = 0.8
scratchpad_height_ratio = 0.9
single_scratchpad       = 1

# ── Focus & windows ─────────────────────────────────────────
sloppy_focus                      = 0  # 0 = focus on click, 1 = focus follows the mouse
warp_cursor                       = 1  # cursor jumps to a window focused with the keyboard
focus_on_activate                 = 1
focus_cross_monitor               = 1  # Super+arrows reach the other monitor
exchange_cross_monitor            = 1  # moving a window with the keys crosses monitors too
focus_cross_tag                   = 0
focus_direction_only_zone_overlap = 1
enable_floating_snap              = 1  # floating windows snap to edges and each other
snap_distance                     = 30
enable_border_resize              = 1  # drag a window border to resize (resize_on_border)
border_resize_size                = 10
drag_tile_to_tile                 = 1  # Super+drag a tiled window onto another: they swap
drag_tile_small                   = 1
drag_corner                       = 4  # Super+right drag resizes from the corner nearest the cursor
drag_warp_cursor                  = 0  # the cursor stays where it is while resizing
float_full_to_top                 = 0
cursor_hide_on_keypress           = 1  # pointer hides while typing
cursor_hide_timeout               = 0  # seconds without movement before it hides, 0 = never
idle_inhibit_when_fullscreen      = 1  # no lock or screens off while a fullscreen window has focus
idle_inhibit_ignore_visible       = 0

# ── Keyboard ────────────────────────────────────────────────
# Layout and options belong in local.toml; without them mango uses us.
repeat_rate  = 25
repeat_delay = 600
numlock_on   = 1
# xkb_rules_layout  = "us,de"
# xkb_rules_variant = ","
# xkb_rules_options = "grp:alt_shift_toggle"

# ── Mouse ───────────────────────────────────────────────────
# One device only: device_rule in local.toml
mouse_natural_scrolling = 0
mouse_accel_profile     = 2     # 0 none, 1 flat, 2 adaptive
mouse_accel_speed       = 0.0   # -1.0 .. 1.0
axis_scroll_factor      = 1.0

# ── Trackpad (some settings need a re-login) ────────────────
tap_to_click                  = 1
tap_and_drag                  = 1
drag_lock                     = 1
trackpad_natural_scrolling    = 0
trackpad_disable_while_typing = 1
trackpad_scroll_factor        = 1.0
gesture_live                  = 1   # gestures move with the fingers (keybindings.toml)

# ── Overview (Super+Tab, 3 fingers) ─────────────────────────
overview_gap_inner = 5
overview_gap_outer = 30
enable_hotarea     = 0   # 1 = pointer in a screen corner opens the overview
hotarea_corner     = 2   # 0 top left, 1 top right, 2 bottom left, 3 bottom right
hotarea_size       = 10
# jump_labels = "HJKLASDFGQWERTYUIOPZXCVBNM"

# ── System ──────────────────────────────────────────────────
auto_reload_config      = 1   # saving a config file reloads mango
xwayland_persistence    = 1
sync_obj_enable         = 1   # helps games; needs a restart
allow_tearing           = 0   # 1 = games may tear (lower latency), 2 = fullscreen only
allow_shortcuts_inhibit = 1   # apps (VMs, remote desktop) may grab all keys
allow_lock_transparent  = 0
disable_middle_paste    = 0   # 1 = no middle-click paste (wayland apps)
