# ============================================================
# env.toml  –  Environment variables and config variables
# [env] changes reach apps started after a reload; some need
# a re-login (mango re-sets them on every reload).
# ============================================================

# ── Environment for apps started by mango ───────────────────
# mango sets XDG_CURRENT_DESKTOP=mango, WAYLAND_DISPLAY, DISPLAY
# (XWayland) and _JAVA_AWT_WM_NONREPARENTING=1 itself.
[env]
XDG_SESSION_TYPE    = "wayland"
XDG_SESSION_DESKTOP = "mango"

# Cursor for X11 / XWayland apps (theme.toml sets it for mango)
XCURSOR_THEME = "Nordzy-cursors-white"
XCURSOR_SIZE  = "24"

# GTK: wayland backend, unscaled (the monitor rule scales)
GDK_BACKEND = "wayland"
GDK_SCALE   = "1"

# Qt and SDL on wayland
QT_QPA_PLATFORM                     = "wayland"
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"
SDL_VIDEODRIVER                     = "wayland"

# Electron apps on wayland (Obsidian, VS Code ...)
# ELECTRON_OZONE_PLATFORM_HINT = "auto"
# Firefox
# MOZ_ENABLE_WAYLAND = "1"
# NVIDIA only
# LIBVA_DRIVER_NAME         = "nvidia"
# __GLX_VENDOR_LIBRARY_NAME = "nvidia"

# ── Config variables ────────────────────────────────────────
# Used as $name in the later files. Only names defined here are
# replaced: $HOME, $(...) and shell variables reach the shell as
# they are. local.toml may redefine them.
[var]
term    = "footclient"
editor  = "lite-xl"
editor2 = "mousepad"
files   = "thunar"
browser = "firefox"
#menu    = "rofi -combi-modi window,drun,run -show combi -modi combi"
menu    = "fuzzel"

# Start a GUI app as root (Super+Shift+T/E/M/F)
root = 'pkexec env WAYLAND_DISPLAY="$WAYLAND_DISPLAY" XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" DISPLAY="$DISPLAY"'
