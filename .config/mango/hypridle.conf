# hypridle for mango, started by autostart.toml with
#   hypridle -c ~/.config/mango/hypridle.conf
# Screens go off and on through mmsg; a panel disabled by the lid stays off.

$screens_off = for m in $(mmsg get all-monitors | jq -r '.monitors[]|select(.width>0).name'); do mmsg dispatch sleep_monitor,^$m$; done
$screens_on  = for m in $(mmsg get all-monitors | jq -r '.monitors[]|select(.width>0).name'); do mmsg dispatch wakeup_monitor,^$m$; done

general {
    lock_cmd         = pidof hyprlock || hyprlock
    unlock_cmd       = notify-send -t 2000 "🔓 Unlocked"
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd  = sleep 1 && $screens_on
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false
}

# 10 min → lock screen; not while mpv runs, Brave plays sound or YouTube has focus,
# unless Super+X made /tmp/idle_override
listener {
    timeout    = 600
    on-timeout = [ -f /tmp/idle_override ] || (! pgrep -x mpv && ! pactl list sink-inputs | grep -q "application.name.*Brave" && ! mmsg get focusing-client | grep -iq youtube) && (pidof hyprlock || hyprlock)
    on-resume  = rm -f /tmp/idle_override && notify-send -t 2000 "Idle override cleared"
}

# 10.5 min → screens off, same conditions
listener {
    timeout    = 630
    on-timeout = [ -f /tmp/idle_override ] || (! pgrep -x mpv && ! pactl list sink-inputs | grep -q "application.name.*Brave" && ! mmsg get focusing-client | grep -iq youtube) && $screens_off
    on-resume  = sleep 2 && $screens_on
}
