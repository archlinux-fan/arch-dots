# ============================================================
# config.toml  –  mango entry point
# mango reads ~/.config/mango/config.toml (a config.conf there
# would win, so don't create one).
#
# The settings live in the files below, read top to bottom.
# Options, rules and $variables: a later file overrides an earlier one.
#
# local.toml comes from the private repo (keyboard, monitors, own keys).
# It is read after the settings and rules, so it can override them,
# and before keybindings.toml, so its [var] values ($browser ...) are
# the ones the keybindings use.
#
# source_optional = source that skips a missing file: only local.toml
# may be missing, the rest ship with these dotfiles.
#
# Saving any of these files reloads mango (auto_reload_config).
# Check for errors without (re)starting:  mango -p
# Wiki: https://github.com/mangowm/mango/wiki   (TOML syntax: wiki/toml)
# ============================================================

[global]
source_optional = [
    "./env.toml",          # environment + $variables (programs)
    "./theme.toml",        # borders, colours, gaps, blur, shadows, animations
    "./general.toml",      # tags, layouts, focus, input, overview, system
    "./windowrules.toml",  # tag, window and layer rules
    "./autostart.toml",    # programs started with mango
    "./local.toml",        # personal overrides (arch-private)
    "./keybindings.toml",  # keys, mouse, scroll, gestures
]
