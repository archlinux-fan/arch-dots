# swayidle for mango, started by autostart.toml with
#   swayidle -w -C ~/.config/mango/swayidle.conf
# One event per line (man swayidle); the command in single quotes runs through sh.
# swaylock forks once locked (daemonize in ~/.config/swaylock/config), so -w waits only for that.
# Screens go off and on through mmsg; a panel disabled by the lid stays off.
# A fullscreen window or mpv with focus also keeps mango awake (idle_inhibit_* in general.toml, windowrules.toml).

# Lock before sleep (lid, power key); screens on after it
before-sleep 'pidof swaylock || swaylock'
after-resume 'sleep 1; for m in $(mmsg get all-monitors | jq -r ".monitors[]|select(.width>0).name"); do mmsg dispatch wakeup_monitor,^$m$; done'

# 10 min idle: screens off, locked first if not locked yet.
#   Super+X (/tmp/idle_override): nothing, it means screens off without a lock
#   already locked: off, whatever is playing
#   not locked: only when no mpv runs, Firefox plays no sound and YouTube has no focus
# On again with the first activity; after Super+X only a key does that (keybindings.toml)
timeout 600 '[ -f /tmp/idle_override ] && exit; pidof swaylock >/dev/null || { ! pgrep -x mpv && ! pactl list sink-inputs | grep -q "application.name.*Firefox" && ! mmsg get focusing-client | grep -iq youtube && swaylock; } && for m in $(mmsg get all-monitors | jq -r ".monitors[]|select(.width>0).name"); do mmsg dispatch sleep_monitor,^$m$; done' resume '[ -f /tmp/idle_override ] || { sleep 2; for m in $(mmsg get all-monitors | jq -r ".monitors[]|select(.width>0).name"); do mmsg dispatch wakeup_monitor,^$m$; done; }'
