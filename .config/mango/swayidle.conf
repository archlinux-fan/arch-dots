# swayidle for mango, started by autostart.toml with
#   swayidle -w -C ~/.config/mango/swayidle.conf
# One event per line (man swayidle); the command in single quotes runs through sh.
# swaylock forks once locked (daemonize in ~/.config/swaylock/config), so -w waits only for that.
# Screens go off and on through mmsg; a panel disabled by the lid stays off.
# A playing video (mpv, Firefox) also pauses the idle timer itself (idle inhibit); a paused one doesn't.

# Lock before sleep (lid, power key); screens on after it
before-sleep 'pidof swaylock || swaylock'
after-resume 'sleep 1; for m in $(mmsg get all-monitors | jq -r ".monitors[]|select(.width>0).name"); do mmsg dispatch wakeup_monitor,^$m$; done'

# 10 min idle: screens off, 10.5 min: locked. Neither while mpv or Firefox (YouTube) plays:
# a paused one has a corked stream and doesn't count. Nor after Super+X (/tmp/idle_override:
# screens off, never locked). Super+L locks at once, screens off after 15 s (keybindings.toml).
# On again with the first activity; after Super+X only a key does that.
timeout 600 '[ -f /tmp/idle_override ] || pactl -f json list sink-inputs | jq -e "any(.[]; .corked == false and (.properties[\"application.name\"] | test(\"mpv|firefox\"; \"i\")))" >/dev/null || for m in $(mmsg get all-monitors | jq -r ".monitors[]|select(.width>0).name"); do mmsg dispatch sleep_monitor,^$m$; done' resume '[ -f /tmp/idle_override ] || { sleep 2; for m in $(mmsg get all-monitors | jq -r ".monitors[]|select(.width>0).name"); do mmsg dispatch wakeup_monitor,^$m$; done; }'
timeout 630 '[ -f /tmp/idle_override ] || pactl -f json list sink-inputs | jq -e "any(.[]; .corked == false and (.properties[\"application.name\"] | test(\"mpv|firefox\"; \"i\")))" >/dev/null || pidof swaylock || swaylock'
