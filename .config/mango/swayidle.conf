# swayidle for mango, started by autostart.toml with
#   swayidle -w -C ~/.config/mango/swayidle.conf
# One event per line (man swayidle); the command in single quotes runs through sh.
# swaylock forks once locked (daemonize in ~/.config/swaylock/config), so -w waits only for that.
# Screens go off and on through mmsg; a panel disabled by the lid stays off.
# A fullscreen window or mpv with focus also keeps mango awake (idle_inhibit_* in general.toml, windowrules.toml).

# Lock before sleep (lid, power key); screens on after it
before-sleep 'pidof swaylock || swaylock'
after-resume 'sleep 1; for m in $(mmsg get all-monitors | jq -r ".monitors[]|select(.width>0).name"); do mmsg dispatch wakeup_monitor,^$m$; done'

# 10 min: lock; not while mpv runs, Firefox plays sound or YouTube has focus,
# unless Super+X made /tmp/idle_override (removed again on the next activity)
timeout 600 '[ -f /tmp/idle_override ] || (! pgrep -x mpv && ! pactl list sink-inputs | grep -q "application.name.*Firefox" && ! mmsg get focusing-client | grep -iq youtube) && (pidof swaylock || swaylock)' resume 'rm /tmp/idle_override 2>/dev/null && notify-send -t 2000 "Idle override cleared"'

# 10.5 min: screens off, same conditions; on again with the first activity
timeout 630 '[ -f /tmp/idle_override ] || (! pgrep -x mpv && ! pactl list sink-inputs | grep -q "application.name.*Firefox" && ! mmsg get focusing-client | grep -iq youtube) && for m in $(mmsg get all-monitors | jq -r ".monitors[]|select(.width>0).name"); do mmsg dispatch sleep_monitor,^$m$; done' resume 'sleep 2; for m in $(mmsg get all-monitors | jq -r ".monitors[]|select(.width>0).name"); do mmsg dispatch wakeup_monitor,^$m$; done'
