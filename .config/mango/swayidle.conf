# swayidle for mango, started by autostart.toml with
#   swayidle -w -C ~/.config/mango/swayidle.conf
# One event per line (man swayidle); the command in single quotes runs through sh.
# swaylock forks once locked (daemonize in ~/.config/swaylock/config), so -w waits only for that.
# Screens off / on and the lock when idle: ~/.local/bin/screens.
# A playing video (mpv, Firefox) also pauses the idle timer itself (idle inhibit); a paused one doesn't.

# Lock before sleep (lid, power key); screens on after it
before-sleep 'pidof swaylock || swaylock'
after-resume 'sleep 1; screens on'

# 10 min idle: screens off, 30 s later locked; while mpv or Firefox plays sound, only once it stops.
# Not after Super+X (screens off, never locked; only a key turns them on again).
# "screens idle" in the background: -w would wait for it and swayidle could do nothing else meanwhile.
# Without the script (a new file, not linked into ~ yet) it locks at once.
timeout 600 'command -v screens >/dev/null || exec swaylock; screens idle &' resume 'screens back'
