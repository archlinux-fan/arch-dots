# fuzzel: app launcher and command runner (Super+Space), Nord like waybar and mako.
# Enter starts the selected entry; Shift+Enter runs the typed text as it is, with arguments.
# Comments only on their own line. All options: man fuzzel.ini

[main]
font=Noto Sans:style=Bold:pixelsize=12
dpi-aware=auto
prompt="❯   "
placeholder=App or command   ·   Shift+Enter runs the text as typed
icon-theme=Nordzy
# Search the name, description, categories, keywords and file name of apps
fields=name,generic,comment,categories,filename,keywords
# Every program in PATH is listed too, so commands work (e.g. foot when the foot server crashed)
list-executables-in-path=yes
# App actions too, e.g. Brave's New Incognito Window
show-actions=yes
# Terminal apps (btop, htop ...) open in foot, not footclient: works without the foot server
terminal=foot -e
width=60
lines=12
line-height=24
horizontal-pad=32
vertical-pad=20
inner-pad=10
# Click and scroll the list with the mouse
enable-mouse=yes
# Stay open while the mouse is over another window
exit-on-keyboard-focus-loss=no

[colors]
# nord0 background and nord9 border as waybar and mako; the selected line a nord9 pill;
# the title above a menu (Reboot?, Wi-Fi ...) nord9, so it is no choice
background=2e3440f2
text=d8dee9ff
message=81a1c1ff
prompt=81a1c1ff
placeholder=616e88ff
input=eceff4ff
match=88c0d0ff
selection=81a1c1ff
selection-text=2e3440ff
selection-match=eceff4ff
counter=616e88ff
border=81a1c1ff

[border]
width=1
radius=10
selection-radius=8

[dmenu]
exit-immediately-if-empty=yes
