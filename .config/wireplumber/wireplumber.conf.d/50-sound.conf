# The default output is always the best one connected, by priority:
# Bluetooth headphones (3000) > monitor over HDMI/DisplayPort (1500) > built-in (about 1000).
# Same for the mic: headphones' mic first, then the built-in one.
# Check with: wpctl status (the default has a *)

wireplumber.settings = {
  # Pick the default by priority, don't keep a device chosen by hand
  node.restore-default-targets = false
  # Apps follow the default device instead of the one they used last time
  node.stream.restore-target = false
  # Headphones play in music quality (A2DP); when an app records (a video call),
  # they switch to headset mode with their mic, and back when the call ends
  bluetooth.autoswitch-to-headset-profile = true
}

monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_.*" } ]
    actions = { update-props = { priority.session = 3000 } }
  }
]

monitor.alsa.rules = [
  {
    # Monitors have no hardware volume, so volume is done in software
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = { update-props = { priority.session = 1500, api.alsa.soft-mixer = true } }
  }
]
