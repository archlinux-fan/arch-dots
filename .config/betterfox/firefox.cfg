// New tab opens the homepage, when it is a local file
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  Services.obs.addObserver(() => {
    let url = Services.prefs.getCharPref("browser.startup.homepage", "");
    if (url.startsWith("/")) url = "file://" + url;
    if (url.startsWith("file:")) AboutNewTab.newTabURL = url;
  }, "final-ui-startup");
} catch (e) {}
