general {
    lock_cmd         = pidof hyprlock || hyprlock
    unlock_cmd       = notify-send -t 2000 "🔓 Unlocked"
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd  = sleep 1 && hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false
}

# 10 min → lock screen
listener {
    timeout  = 600
    on-timeout = bash -c '[ -f /tmp/hypr_idle_override ] || \
        (! pgrep -x mpv && \
         ! pactl list sink-inputs | grep -q "application.name.*Brave" && \
         ! hyprctl activewindow -j | grep -iq youtube) && \
        (pidof hyprlock || hyprlock)'
    on-resume = bash -c 'rm -f /tmp/hypr_idle_override && notify-send -t 2000 "Idle override cleared"'
}

# 10.5 min → DPMS off
# With the Lua config `hyprctl dispatch` takes Lua - plain "dpms off" fails
listener {
    timeout    = 630
    on-timeout = bash -c '[ -f /tmp/hypr_idle_override ] || \
        (! pgrep -x mpv && \
         ! pactl list sink-inputs | grep -q "application.name.*Brave" && \
         ! hyprctl activewindow -j | grep -iq youtube) && \
        hyprctl dispatch "hl.dsp.dpms({ action = \"off\" })"'
    on-resume  = sleep 2 && hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
