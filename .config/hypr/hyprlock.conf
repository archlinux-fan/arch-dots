general {
  hide_cursor = true
}

background {
    monitor =
    path = screenshot # screen just before locking, blurred
    # color = rgba(25, 20, 20, 1.0)
    color = rgb(2e3440) # nord0, fallback if the image is missing
    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_passes = 1 # 0 disables blurring
    blur_size = 13
    noise = 0.0 # 0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
    zindex = -2
}

# Nord tint over the blurred screenshot; alpha sets how much shows through
shape {
    monitor =
    size = 100%, 100%
    color = rgba(2e3440f8) # nord0, 98%
    rounding = 0
    border_size = 0
    zindex = -1
    position = 0, 0
    halign = center
    valign = center
}

# time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date '+%H:%M')"
    text_align = center # center/right or any value for default left. multi-line text alignment inside label container
    color = rgb(eceff4) # nord6
    shadow_passes = 1
    shadow_size = 2
    font_size = 100
    font_family = Noto Sans Bold
    rotate = 0 # degrees, counter-clockwise

    position = 0, 365
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date '+%A, %d %B')"
    text_align = center # center/right or any value for default left. multi-line text alignment inside label container
    color = rgb(d8dee9) # nord4
    shadow_passes = 1
    shadow_size = 2
    font_size = 25
    font_family = Noto Sans Bold
    rotate = 0 # degrees, counter-clockwise

    position = 0, 280
    halign = center
    valign = center
}

# face
image {
    monitor =
    path = ~/pictures/wallpapers/login_nord6_light.png
    size = 250 # lesser side if not 1:1 ratio
    rounding = -1 # negative values mean circle
    border_size = 4
    border_color = rgb(434C5E) # nord2
    rotate = 0 # degrees, counter-clockwise
    shadow_passes = 10
    shadow_size = 2
    reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
    reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F

    position = 0, 65
    halign = center
    valign = center
}

shape {
    monitor =
    size = 340, 76
    color = rgba(434c5e66) # nord2, 40%
    rounding = -1
    border_size = 0
    border_color = rgba(0, 207, 230, 1.0)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 0, -155
    halign = center
    valign = center
}

label {
    monitor =
    text = <span font='Font Awesome 7 Free'></span>  $USER
    text_align = center # center/right or any value for default left. multi-line text alignment inside label container
    color = rgb(81a1c1) # nord9
    shadow_passes = 0
    shadow_size = 2
    font_size = 22
    font_family = Noto Sans
    rotate = 0 # degrees, counter-clockwise

    position = 0, -155
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 76
    font_size = 22
    outline_thickness = 2
    dots_size = 0.24 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.18 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(81a1c1) # nord9
    inner_color = rgba(434c5e66) # nord2, 40%
    font_color = rgb(81a1c1) # nord9
    fade_on_empty = false
    fade_timeout = 0 # Milliseconds before fade_on_empty is triggered.
    # placeholder_text = ...
    placeholder_text = <span font='Font Awesome 7 Free'></span>
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(5e81ac) # nord10, while checking the password
    fail_color = rgb(bf616a) # nord11, if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL</i> # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below

    position = 0, -260
    halign = center
    valign = center
}
